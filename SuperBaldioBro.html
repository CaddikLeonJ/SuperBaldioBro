function prepareFartSustain(buf,ac,start,end){

 const off=new Offline(channels,Math.floor(sr*seconds),sr);

  const dur=.18+Math.random()*.10;
  const rate=.96+Math.random()*.08;
  const sourceDur=Math.min(end-start,dur*rate);
  const room=Math.max(0,(end-start)-sourceDur);

 fartSustainPromise=off.startRendering()
  .then(b=>{fartSustainBuffer=b;return b})
  .catch(()=>null)
  .finally(()=>{fartSustainPromise=null});
