<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fat Nap: Super Baldio Bro — v0.2.2 Sprite Loading Fix</title>
<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#070910;
touch-action:none;
overscroll-behavior:none;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
font-family:Arial,Helvetica,sans-serif;
}
canvas{
display:block;
width:100vw;
height:100dvh;
touch-action:none;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(()=>{
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d",{alpha:false});
const state = {
w: 0,
h: 0,
dpr: 1,
stageH: 0,
controlsY: 0,
worldW: 0,
cameraX: 0,
cameraTargetX: 0,
time: 0,
last: performance.now(),
accumulator: 0,
started: false
};
const player = {
x: 180,
y: 0,
w: 34,
standH: 64,
crouchH: 40,
h: 64,
vx: 0,
vy: 0,
dir: 1,
grounded: true,
crouching: false,
running: false
};
const PHYS = {
gravity: 1850,
walkSpeed: 175,
runSpeed: 315,
accel: 1600,
airAccel: 900,
friction: 1700,
jumpSpeed: 650
};
const input = {
moveX: 0,
moveY: 0,
run: false,
jumpQueued: false,
joystickPointer: null,
runPointer: null,
jumpPointer: null,
keys: new Set()
};
const ui = {
joyX: 0, joyY: 0, joyR: 58,
knobX: 0, knobY: 0, knobR: 25,
jumpX: 0, jumpY: 0, jumpR: 48,
runX: 0, runY: 0, runR: 42
};

// v0.2.2 official Fat Nap movement sprite atlas — split into 3 image rows for iPhone WebView reliability.
const atlasRows = [new Image(),new Image(),new Image()];
let atlasReady = false;
let atlasError = false;
let atlasLoaded = 0;
const ATLAS_COMMIT = "c09fa00acd7f205ef5acc4abd48ee472a1a22738";
const ATLAS_BASE = "https://cdn.jsdelivr.net/gh/CaddikLeonJ/SuperBaldioBro@"+ATLAS_COMMIT+"/assets/atlas_row";
const frames = {
idle:{sx:0,sy:0,ox:37,oy:5,w:42,h:100},
walk1:{sx:117,sy:0,ox:21,oy:5,w:74,h:100},
walk2:{sx:234,sy:0,ox:42,oy:5,w:33,h:100},
walk3:{sx:351,sy:0,ox:21,oy:5,w:74,h:100},
walk4:{sx:0,sy:110,ox:42,oy:5,w:33,h:100},
run1:{sx:117,sy:110,ox:13,oy:5,w:90,h:100},
run2:{sx:234,sy:110,ox:25,oy:5,w:66,h:100},
run3:{sx:351,sy:110,ox:10,oy:5,w:97,h:100},
run4:{sx:0,sy:220,ox:25,oy:5,w:67,h:100},
jump:{sx:117,sy:220,ox:5,oy:5,w:107,h:100},
crouch:{sx:234,sy:220,ox:24,oy:5,w:68,h:100}
};
atlasRows.forEach((img,i)=>{
  img.onload=()=>{ atlasLoaded++; if(atlasLoaded===atlasRows.length){atlasReady=true; atlasError=false;} };
  img.onerror=()=>{atlasError=true;};
  img.src=ATLAS_BASE+(i+1)+".svg";
});
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
const audio = {
ctx: null,
master: null,
musicTimer: null,
step: 0,
started: false
};
function ensureAudio(){
if(!audio.ctx){
const AC = window.AudioContext || window.webkitAudioContext;
if(!AC) return false;
audio.ctx = new AC();
audio.master = audio.ctx.createGain();
audio.master.gain.value = 0.16;
audio.master.connect(audio.ctx.destination);
}
if(audio.ctx.state === "suspended") audio.ctx.resume();
if(!audio.started){
audio.started = true;
startTestMusic();
}
return true;
}
function tone(freq, dur=0.12, type="square", volume=0.18, when=0){
if(!audio.ctx || !audio.master) return;
const t = audio.ctx.currentTime + when;
const osc = audio.ctx.createOscillator();
const gain = audio.ctx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq,t);
gain.gain.setValueAtTime(0.0001,t);
gain.gain.exponentialRampToValueAtTime(Math.max(0.001,volume),t+0.01);
gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
osc.connect(gain);
gain.connect(audio.master);
osc.start(t);
osc.stop(t+dur+0.03);
}
function sfxJump(){
if(!ensureAudio()) return;
tone(330,0.08,"square",0.20,0);
tone(520,0.12,"square",0.16,0.07);
}
function sfxRun(){
if(!ensureAudio()) return;
tone(150,0.06,"sawtooth",0.14,0);
tone(210,0.07,"square",0.11,0.05);
}
function sfxCrouch(){
if(!ensureAudio()) return;
tone(180,0.09,"triangle",0.12,0);
}
function sfxStart(){
if(!ensureAudio()) return;
tone(262,0.08,"square",0.16,0);
tone(392,0.09,"square",0.14,0.07);
tone(523,0.14,"triangle",0.12,0.15);
}
function startGame(){
if(state.started) return;
state.started = true;
ensureAudio();
sfxStart();
}
function startTestMusic(){
if(audio.musicTimer) return;
const notes = [262,330,392,330,294,349,440,349,262,330,392,523,440,392,330,294];
const tick = ()=>{
if(!audio.ctx || audio.ctx.state !== "running") return;
const n = notes[audio.step % notes.length];
tone(n,0.16,"square",0.055,0);
if(audio.step % 4 === 0) tone(n/2,0.22,"triangle",0.045,0);
audio.step++;
};
tick();
audio.musicTimer = setInterval(tick,220);
}
function resize(){
state.dpr = Math.min(window.devicePixelRatio || 1, 2);
state.w = Math.round(window.visualViewport?.width || window.innerWidth);
state.h = Math.round(window.visualViewport?.height || window.innerHeight);
canvas.width = Math.round(state.w * state.dpr);
canvas.height = Math.round(state.h * state.dpr);
canvas.style.width = state.w+"px";
canvas.style.height = state.h+"px";
ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
state.stageH = Math.floor(state.h * 0.70);
state.controlsY = state.stageH;
state.worldW = Math.max(state.w * 2.8, 1600);
ui.joyX = Math.max(76, state.w * 0.19);
ui.joyY = state.controlsY + (state.h-state.controlsY) * 0.56;
ui.jumpX = state.w - 68;
ui.jumpY = state.controlsY + (state.h-state.controlsY) * 0.58;
ui.runX = state.w - 160;
ui.runY = state.controlsY + (state.h-state.controlsY) * 0.42;
const floorY = getFloorY();
if(!Number.isFinite(player.y) || player.y === 0){
player.y = floorY - player.h;
}else if(player.grounded){
player.y = floorY - player.h;
}
}
function getFloorY(){
return state.stageH * 0.80;
}
function roundRect(x,y,w,h,r){
r = Math.min(r,w/2,h/2);
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}
function setCrouch(active){
if(active === player.crouching) return;
if(active) sfxCrouch();
const feet = player.y + player.h;
player.crouching = active;
player.h = active ? player.crouchH : player.standH;
player.y = feet - player.h;
}
function moveToward(v,target,maxDelta){
if(v < target) return Math.min(v+maxDelta,target);
if(v > target) return Math.max(v-maxDelta,target);
return target;
}
function updateInputFromKeys(){
let x = 0, y = 0;
if(input.keys.has("ArrowLeft") || input.keys.has("KeyA")) x -= 1;
if(input.keys.has("ArrowRight") || input.keys.has("KeyD")) x += 1;
if(input.keys.has("ArrowDown") || input.keys.has("KeyS")) y = 1;
if(x !== 0 || y !== 0){
input.moveX = x;
input.moveY = y;
}
input.run = input.run || input.keys.has("ShiftLeft") || input.keys.has("ShiftRight");
}
function physicsStep(dt){
const floorY = getFloorY();
updateInputFromKeys();
const wantsCrouch = input.moveY > 0.58 && player.grounded;
setCrouch(wantsCrouch);
const move = Math.abs(input.moveX) > 0.1 ? input.moveX : 0;
player.running = !!input.run && Math.abs(move) > 0.1 && !player.crouching;
const maxSpeed = player.crouching ? PHYS.walkSpeed*0.38 : (player.running ? PHYS.runSpeed : PHYS.walkSpeed);
const targetVx = move * maxSpeed;
const accel = player.grounded ? PHYS.accel : PHYS.airAccel;
if(move !== 0){
player.vx = moveToward(player.vx,targetVx,accel*dt);
player.dir = move > 0 ? 1 : -1;
}else{
player.vx = moveToward(player.vx,0,PHYS.friction*dt);
}
if(input.jumpQueued && player.grounded && !player.crouching){
sfxJump();
player.vy = -PHYS.jumpSpeed;
player.grounded = false;
}
input.jumpQueued = false;
if(!player.grounded) player.vy += PHYS.gravity * dt;
player.x += player.vx * dt;
player.y += player.vy * dt;
player.x = clamp(player.x, 0, state.worldW - player.w);
if(player.y + player.h >= floorY){
player.y = floorY - player.h;
player.vy = 0;
player.grounded = true;
}
state.cameraTargetX = clamp(
player.x + player.w*0.5 - state.w*0.44,
0,
Math.max(0,state.worldW-state.w)
);
state.cameraX = lerp(state.cameraX,state.cameraTargetX,1-Math.pow(0.0002,dt));
}
function drawRoom(){
const floorY = getFloorY();
const cam = state.cameraX;
ctx.fillStyle = "#171c2c";
ctx.fillRect(0,0,state.w,state.stageH);
const panelW = 260;
for(let wx = 0; wx < state.worldW; wx += panelW){
const sx = wx - cam;
if(sx < -panelW || sx > state.w) continue;
ctx.fillStyle = (Math.floor(wx/panelW)%2===0) ? "#20263a" : "#1d2335";
ctx.fillRect(sx,0,panelW,state.stageH);
ctx.fillStyle = "#2c3348";
ctx.fillRect(sx+panelW-3,0,3,state.stageH);
}
drawWorldRect(100, floorY-180, 240, 120, "#30384c"); // bed
drawWorldRect(390, floorY-200, 320, 22, "#343b4f"); // desk top
drawWorldRect(420, floorY-178, 18, 178, "#2a3042");
drawWorldRect(665, floorY-178, 18, 178, "#2a3042");
drawWorldRect(455, floorY-310, 95, 72, "#0c0f17"); // monitor
drawWorldRect(465, floorY-300, 75, 52, "#5162d8");
drawWorldRect(565, floorY-310, 95, 72, "#0c0f17");
drawWorldRect(575, floorY-300, 75, 52, "#5a607b");
drawWorldRect(870, floorY-145, 75, 145, "#302938"); // shelf
drawWorldRect(1020, floorY-250, 110, 250, "#403043"); // wardrobe
drawWorldRect(1370, floorY-205, 150, 205, "#2d3446"); // cabinet
ctx.fillStyle = "#33394b";
ctx.fillRect(0,floorY,state.w,state.stageH-floorY);
ctx.fillStyle = "#555e75";
ctx.fillRect(0,floorY, state.w, 4);
}
function drawWorldRect(wx,wy,w,h,color){
const sx = wx - state.cameraX;
if(sx+w < 0 || sx > state.w) return;
ctx.fillStyle = color;
ctx.fillRect(sx,wy,w,h);
}
function currentFrame(){
if(!player.grounded) return frames.jump;
if(player.crouching) return frames.crouch;
const speed=Math.abs(player.vx);
if(player.running && speed>40) return frames["run"+(Math.floor(state.time*10)%4+1)];
if(speed>15) return frames["walk"+(Math.floor(state.time*7)%4+1)];
return frames.idle;
}
function drawPlayer(){
if(!atlasReady) return;
const f=currentFrame();
const feetX=Math.round(player.x-state.cameraX+player.w/2);
const feetY=Math.round(player.y+player.h+1);
let displayH=150;
if(f===frames.crouch) displayH=116;
if(f===frames.jump) displayH=140;
const displayW=f.w*(displayH/f.h);
ctx.save();
ctx.translate(feetX,feetY);
if(player.dir<0) ctx.scale(-1,1);
ctx.imageSmoothingEnabled=true;
const row=atlasRows[Math.floor(f.sy/110)];
ctx.drawImage(row,f.sx+f.ox,f.oy,f.w,f.h,-displayW/2,-displayH,displayW,displayH);
ctx.restore();
}
function drawHUD(){
ctx.fillStyle = "rgba(7,9,16,.72)";
ctx.fillRect(0,0,state.w,32);
ctx.fillStyle = "#ffffff";
ctx.font = "700 13px Arial";
ctx.textAlign = "left";
ctx.fillText("FAT NAP: SUPER BALDIO BRO — v0.2.2 SPRITE FIX",10,20);
ctx.fillStyle = "#b9bfd2";
ctx.font = "11px Arial";
ctx.textAlign = "right";
ctx.fillText(!player.grounded ? "JUMP" : (player.crouching ? "CROUCH" : (player.running ? "RUN" : (Math.abs(player.vx)>15 ? "WALK" : "IDLE"))),state.w-10,20);
}
function drawControls(){
const controlsH = state.h-state.controlsY;
ctx.fillStyle = "#0a0d15";
ctx.fillRect(0,state.controlsY,state.w,controlsH);
ctx.fillStyle = "#181d2a";
ctx.fillRect(0,state.controlsY,state.w,2);
ctx.globalAlpha = 0.92;
ctx.fillStyle = "#141925";
ctx.strokeStyle = "#5a6070";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(ui.joyX,ui.joyY,ui.joyR,0,Math.PI*2);
ctx.fill(); ctx.stroke();
const knobDX = input.moveX * ui.joyR * 0.46;
const knobDY = input.moveY * ui.joyR * 0.46;
ctx.fillStyle = "#3a4050";
ctx.beginPath();
ctx.arc(ui.joyX+knobDX,ui.joyY+knobDY,ui.knobR,0,Math.PI*2);
ctx.fill();
ctx.fillStyle = input.run ? "#7b5f2a" : "#2f3546";
ctx.strokeStyle = "#737b91";
ctx.beginPath();
ctx.arc(ui.runX,ui.runY,ui.runR,0,Math.PI*2);
ctx.fill(); ctx.stroke();
ctx.fillStyle = "#fff";
ctx.font = "700 13px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText("RUN",ui.runX,ui.runY);
ctx.fillStyle = "#35558e";
ctx.strokeStyle = "#7f97c5";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(ui.jumpX,ui.jumpY,ui.jumpR,0,Math.PI*2);
ctx.fill(); ctx.stroke();
ctx.fillStyle = "#fff";
ctx.font = "700 14px Arial";
ctx.fillText("JUMP",ui.jumpX,ui.jumpY);
ctx.globalAlpha = 1;
ctx.textAlign = "left";
ctx.textBaseline = "alphabetic";
ctx.fillStyle = "#8e96aa";
ctx.font = "11px Arial";
ctx.fillText("Pull stick down to crouch",10,state.h-12);
}
function drawStartOverlay(){
if(state.started) return;
ctx.fillStyle = "rgba(3,4,8,.84)";
ctx.fillRect(0,0,state.w,state.h);
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillStyle = "#ffffff";
ctx.font = "900 30px Arial";
ctx.fillText("SUPER BALDIO BRO", state.w/2, state.h*0.39);
ctx.fillStyle = "#cfd5e6";
ctx.font = "700 18px Arial";
ctx.fillText("Tap anywhere to start", state.w/2, state.h*0.49);
ctx.fillStyle = "#8f98ae";
ctx.font = "13px Arial";
ctx.fillText("Official Fat Nap movement sprites — tap to start", state.w/2, state.h*0.54);
const pulse = 0.65 + Math.sin(state.time*4)*0.18;
ctx.globalAlpha = pulse;
ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(state.w/2, state.h*0.62, 24, 0, Math.PI*2);
ctx.stroke();
ctx.globalAlpha = 1;
ctx.textAlign = "left";
ctx.textBaseline = "alphabetic";
}
function drawLoadingOverlay(){
if(atlasReady) return;
ctx.fillStyle="rgba(3,4,8,.94)";
ctx.fillRect(0,0,state.w,state.h);
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillStyle="#fff";
ctx.font="700 20px Arial";
ctx.fillText(atlasError ? "Sprite load failed" : "Loading Fat Nap...",state.w/2,state.h*0.47);
ctx.fillStyle="#9fa6ba";
ctx.font="13px Arial";
ctx.fillText(atlasError ? "Reopen the game once — this build no longer uses blocked fetch requests." : "Getting the latest official sprite sheet",state.w/2,state.h*0.52);
ctx.textAlign="left";
ctx.textBaseline="alphabetic";
}
function drawOrientationWarning(){
if(state.w <= state.h) return;
ctx.fillStyle = "rgba(3,4,8,.93)";
ctx.fillRect(0,0,state.w,state.h);
ctx.fillStyle = "#fff";
ctx.font = "700 22px Arial";
ctx.textAlign = "center";
ctx.fillText("PORTRAIT MODE ONLY FOR THIS TEST",state.w/2,state.h/2-10);
ctx.fillStyle = "#9fa6ba";
ctx.font = "14px Arial";
ctx.fillText("Turn your phone upright.",state.w/2,state.h/2+20);
}
function render(){
ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
ctx.fillStyle = "#070910";
ctx.fillRect(0,0,state.w,state.h);
drawRoom();
drawPlayer();
drawHUD();
drawControls();
drawStartOverlay();
drawLoadingOverlay();
drawOrientationWarning();
}
function frame(now){
let dt = Math.min((now-state.last)/1000,0.033);
state.last = now;
state.time += dt;
const fixed = 1/120;
state.accumulator += dt;
while(state.accumulator >= fixed){
if(state.started) physicsStep(fixed);
state.accumulator -= fixed;
}
render();
requestAnimationFrame(frame);
}
function pointerPos(e){
const rect = canvas.getBoundingClientRect();
return {
x:(e.clientX-rect.left)*(state.w/rect.width),
y:(e.clientY-rect.top)*(state.h/rect.height)
};
}
function inCircle(px,py,cx,cy,r){
const dx=px-cx, dy=py-cy;
return dx*dx+dy*dy <= r*r;
}
function updateJoystick(px,py){
let dx = px-ui.joyX;
let dy = py-ui.joyY;
const dist = Math.hypot(dx,dy);
const max = ui.joyR;
if(dist > max){
dx = dx/dist*max;
dy = dy/dist*max;
}
input.moveX = clamp(dx/max,-1,1);
input.moveY = clamp(dy/max,-1,1);
}
canvas.addEventListener("pointerdown",e=>{
e.preventDefault();
if(!state.started){
if(!atlasReady) return;
startGame();
return;
}
ensureAudio();
canvas.setPointerCapture?.(e.pointerId);
const p = pointerPos(e);
if(inCircle(p.x,p.y,ui.joyX,ui.joyY,ui.joyR*1.35)){
input.joystickPointer = e.pointerId;
updateJoystick(p.x,p.y);
return;
}
if(inCircle(p.x,p.y,ui.jumpX,ui.jumpY,ui.jumpR*1.2)){
input.jumpPointer = e.pointerId;
input.jumpQueued = true;
return;
}
if(inCircle(p.x,p.y,ui.runX,ui.runY,ui.runR*1.25)){
input.runPointer = e.pointerId;
input.run = true;
sfxRun();
}
},{passive:false});
canvas.addEventListener("pointermove",e=>{
if(e.pointerId !== input.joystickPointer) return;
e.preventDefault();
const p = pointerPos(e);
updateJoystick(p.x,p.y);
},{passive:false});
function releasePointer(e){
e.preventDefault();
if(e.pointerId === input.joystickPointer){
input.joystickPointer = null;
input.moveX = 0;
input.moveY = 0;
}
if(e.pointerId === input.runPointer){
input.runPointer = null;
input.run = false;
}
if(e.pointerId === input.jumpPointer){
input.jumpPointer = null;
}
}
canvas.addEventListener("pointerup",releasePointer,{passive:false});
canvas.addEventListener("pointercancel",releasePointer,{passive:false});
canvas.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("keydown",e=>{
if(!state.started && atlasReady) startGame();
ensureAudio();
input.keys.add(e.code);
if(e.code==="Space" || e.code==="ArrowUp" || e.code==="KeyW"){
input.jumpQueued = true;
e.preventDefault();
}
});
window.addEventListener("keyup",e=>input.keys.delete(e.code));
window.addEventListener("resize",resize);
window.visualViewport?.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,80));
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
