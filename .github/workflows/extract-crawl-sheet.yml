name: Extract crawl sheet
on:
  push:
    paths:
      - ".github/workflows/extract-crawl-sheet.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact transparent PNG from uploaded ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import struct, zipfile
          from pathlib import Path

          archive = Path("Ayofatnap Crawling Animation.zip")
          output = Path("FAT_NAP_CRAWL_4FRAME.png")
          if not archive.exists():
              raise SystemExit("Crawl ZIP not found")

          sig = b"\x89PNG\r\n\x1a\n"

          def png_info(data):
              if len(data) < 33 or data[:8] != sig or data[12:16] != b"IHDR":
                  return None
              w, h = struct.unpack(">II", data[16:24])
              color_type = data[25]
              has_alpha = color_type in (4, 6) or b"tRNS" in data
              return w, h, color_type, has_alpha

          candidates = []
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir() or not info.filename.lower().endswith(".png"):
                      continue
                  data = z.read(info.filename)
                  meta = png_info(data)
                  if meta:
                      candidates.append((meta[3], len(data), info.filename, data, meta))

          if not candidates:
              raise SystemExit("No PNG found inside crawl ZIP")

          # Prefer a PNG that actually contains transparency, then the largest image file.
          candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
          has_alpha, size, name, data, meta = candidates[0]
          if not has_alpha:
              raise SystemExit(f"Selected PNG has no alpha transparency: {name}")

          output.write_bytes(data)
          print(f"Using exact ZIP entry: {name}")
          print(f"PNG: {meta[0]}x{meta[1]}, color type {meta[2]}, alpha={meta[3]}, bytes={size}")
          PY

      - name: Commit exact PNG
        shell: bash
        run: |
          if git diff --quiet -- FAT_NAP_CRAWL_4FRAME.png; then
            echo "Crawl PNG already matches the ZIP."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FAT_NAP_CRAWL_4FRAME.png
          git commit -m "Use exact transparent crawl sheet from ZIP [skip ci]"
          git push
